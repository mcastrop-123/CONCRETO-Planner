
name: Crear version portable Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Crear ejecutable
        run: |
          pyinstaller --noconfirm --windowed --name "CONCRETO Planner" interfaz.py

      - name: Guardar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: CONCRETO-Planner-Windows
          path: dist/CONCRETO Planner/
